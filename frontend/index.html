<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assistant RAG</title>
    <script>
      // Apply the saved/system theme before first paint to avoid a flash
      try {
        const saved = localStorage.getItem('rag-chatbot-theme')
        const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
    <meta name="description" content="Chatbot RAG : posez vos questions et obtenez des réponses basées sur vos documents." />

    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  </body>
</html>
